<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Variable</title>
</head>
<body>
    <script>
        let variable1 = 10;
        console.log(variable1);
        let calculation = variable1 + 5;
        console.log(calculation);
        console.log(calculation + 36);
        calculation = calculation + 5;
        console.log(calculation);

        let result = calculation + 65;
        console.log(result);
        let message = "Hello, World!";
        console.log(message);
        variable1 = 20;
        console.log(variable1);
        variable1=variable1+29;
        console.log(variable1);
        const variable2 = 100;
        console.log(variable2);
        //variable2 = 200; 
        // This will cause an error since const variables cannot be reassigned
        var variable3 = 50;
        console.log(variable3);
        variable3 = 75;
        console.log(variable3);
        console.log(typeof variable1);
        console.log(typeof message);
        console.log(typeof variable2);
        console.log(typeof variable3);

    </script>

</body>
</html>
